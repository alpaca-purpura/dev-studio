# ════════════════════════════════════════════════════════════════════════
#  project.config.yaml — THE SEAM (DIP contract for the harness CORE)
# ════════════════════════════════════════════════════════════════════════
#
#  Single store of every PROJECT/SISTEMA/TECH-specific value the harness CORE
#  reads. The CORE names ZERO concrete tech/sistema/locale/engine/live-env;
#  it reads these abstract SLOTS. Fill them for THIS product (dev-studio).
#
#  Doctor: python3 scripts/harness_config.py --doctor
#  Sentinel for an unfilled slot: __FILL_ME__
#
#  Kit: harness@prenter-marketplace v0.5.3 (plugin, pinned — see CLAUDE.md)
#  Bootstrap: /harness:bootstrap 2026-07-04 · detection sweep: repo greenfield
#  (cero manifests/lockfiles) → detectable slots quedaron __FILL_ME__ salvo
#  los firmados por Chris en la sesión de bootstrap.
#  Re-instalación 2026-07-09: plugin registrado a project-scope (dev-studio → 0.5.3),
#  re-exposición REINSTALLING.md — backflow audit = cero deltas (core in-repo byte-idéntico
#  a 0.5.3), agents/grep-bot re-copiado, hooks (SessionStart+telemetría) reactivados.
#  Slots firmados INTACTOS (re-instanciación segura). Doctor: exit 0.
# ════════════════════════════════════════════════════════════════════════

meta:
  product: dev-studio
  config_version: 1
  description: "Aplicación de escritorio multiplataforma — proceso, arquitectura y documentación as code"
  # firmado Chris 2026-07-04 (bootstrap sweep) · provenance: README.md L1-4 / VISION.md §Identidad

# sistemas[] · market/product instances. Single-sistema = list with ONE entry.
# firmado Chris 2026-07-04 (bootstrap sweep) · provenance: CLAUDE.md «Producto standalone»
sistemas:
  loop_order: [dev-studio]
  active:
    - slug: dev-studio
      status: active

# toolchain · lint/format/typecheck/test/build commands — quoted VERBATIM from
# the repo's own build files (go.mod / package.json).
# firmado Chris 2026-07-06 (DH-13, F1 esqueleto) · provenance: go.mod / web/package.json
toolchain:
  go:
    build: "go build ./..."
    vet: "go vet ./..."
    fmt_check: "gofmt -l ."
    test: "go test ./..."
  web:
    dir: "web"
    dev: "npm run dev"
    build: "npm run build"

# locale · user-facing language rule the copy gates enforce.
# firmado Chris 2026-07-06 (DH-13) · provenance: toda la UI (web/src) está en español
locale: es

# engine_prefix · where SHARED/reusable code lives (anti-duplication grep target).
# firmado Chris 2026-07-06 (DH-13) · provenance: internal/ports + internal/usecase son el único
# código compartido hoy (un solo sistema, dev-studio) — sin motor multi-sistema todavía.
engine_prefix:
  go_glob: "internal/ports/**;internal/usecase/**"

# live_verify_infra · how a story is exercised LIVE before `done`.
# firmado Chris 2026-07-06 (DH-13) · provenance: skill `verify` + Chrome DevTools MCP —
# verificación real hecha en DH-13 (2 sesiones concurrentes en navegador, ver LEDGER).
live_verify_infra: "go build ./cmd/dev-studio && ./dev-studio --addr 127.0.0.1:4173 (curl /api/sessions + Chrome DevTools MCP)"

# design_system_ref · UI-composition canon (or `none` for non-UI products).
# firmado Chris 2026-07-06 (DH-13) · provenance: tokens copiados 1:1 de harness-studio
design_system_ref: "web/src/app/styles/theme.css (tokens Tailwind v4, copiados de harness-studio HS-05)"

# domain_modules · the business modules the process talks about.
# firmado Chris 2026-07-07 (DH-14, F0) · provenance: NORTE-FIRMADO + spec clon §3 + reframe registry
domain_modules:
  - proyecto
  - sesion
  - rol
  - historia
  - capability
  - proceso
  - registry        # F0: registry PROPIO de arneses — rol = arnés instalado (PB-25)
  - organizacion    # TBD — PB-21, dueño Chris; no bloquea el port (mono-usuario mientras tanto)

# agent_roster · worker roles (builder/auditor split) stories route to.
# firmado Chris 2026-07-07 (DH-14, F0) · provenance: stack real del repo (Go backend + React web;
# sin superficie móvil) — NO el roster aspiracional del producto (ese vive en el registry, PB-25)
agent_roster:
  builder: [backend-go, frontend-web]
  auditor: [qa, seguridad, arquitecto-software]
  humano-complementario: [product-owner]

# value_stream · stages the product map derives zones from.
# firmado Chris 2026-07-07 (DH-14, F0) · provenance: modelo de 10 estados de Story en la herencia
# (types.ts:205) reusado 1:1 — Chris eligió los 10 COMPLETOS (parked/dropped incluidos)
value_stream: [idea, refining, refined, ready, developing, developed, reviewing, done, parked, dropped]

# wip_caps · work-in-progress limits the closure gates enforce.
# firmado Chris 2026-07-07 (DH-14, F0): ADVISORY — "se visualizan pero no restringe".
# Los umbrales son referencia visual (propuesta F0), no límite duro; gates reportan, no bloquean.
wip_caps:
  enforcement: advisory
  developing_por_proyecto: 2
  reviewing_por_proyecto: 1
